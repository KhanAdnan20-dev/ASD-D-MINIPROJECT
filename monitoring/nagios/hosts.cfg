define host {
    use                     linux-server
    host_name               intentway-backend
    alias                   IntentWay FastAPI Backend
    address                 backend
    check_command           check_tcp!8000
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}


define host {
    use                     linux-server
    host_name               intentway-frontend
    alias                   IntentWay React Frontend
    address                 frontend
    check_command           check_tcp!5173
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}

define host {
    use                     linux-server
    host_name               intentway-postgres
    alias                   IntentWay PostgreSQL and PostGIS
    address                 postgres
    check_command           check_tcp!5432
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}
