define service {
    use                     generic-service
    host_name               intentway-backend
    service_description     Backend Health
    check_command           check_http!-p 8000 -u /health -s intentway-backend
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}


define service {
    use                     generic-service
    host_name               intentway-frontend
    service_description     Frontend HTTP
    check_command           check_http!-p 5173 -u /
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}

define service {
    use                     generic-service
    host_name               intentway-postgres
    service_description     PostgreSQL Availability
    check_command           check_tcp!5432
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notifications_enabled   0
}
