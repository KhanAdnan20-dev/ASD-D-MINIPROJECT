services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-intentway}
      POSTGRES_USER: ${DATABASE_USER:-intentway}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-intentway_dev}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - intentway-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-intentway}
      DATABASE_USER: ${DATABASE_USER:-intentway}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-intentway_dev}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - intentway-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - intentway-network

  nagios:
    image: jasonrivers/nagios:latest
    container_name: nagios
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./monitoring/nagios/nagios.cfg:/opt/intentway/nagios.cfg:ro
      - ./monitoring/nagios/hosts.cfg:/opt/nagios/etc/objects/intentway-hosts.cfg:ro
      - ./monitoring/nagios/services.cfg:/opt/nagios/etc/objects/intentway-services.cfg:ro
    command:
      - /bin/sh
      - -c
      - |
        if grep -q 'IntentWay monitoring includes' /opt/nagios/etc/nagios.cfg; then
          sed '/# IntentWay monitoring includes:/,$$d' /opt/nagios/etc/nagios.cfg > /tmp/nagios.cfg
          cat /tmp/nagios.cfg > /opt/nagios/etc/nagios.cfg
        fi
        printf '\n' >> /opt/nagios/etc/nagios.cfg
        cat /opt/intentway/nagios.cfg >> /opt/nagios/etc/nagios.cfg
        printf '\n' >> /opt/nagios/etc/nagios.cfg
        exec /usr/local/bin/start_nagios
    networks:
      - intentway-network

volumes:
  postgres-data:

networks:
  intentway-network:
    driver: bridge